name: Release Elastic RAMEN

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      # Token Policy:  https://github.com/elastic/catalog-info/tree/main/resources/github-token-policies/token-policy-elastic-ramen-release-ramen.yaml
      - uses: elastic/oblt-actions/github/create-token@v1
        id: fetch-token
        with:
          token-policy: token-policy-909fc0514fde

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: |
          tag="v${{ inputs.version }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent >/dev/null 2>&1; then
            echo "Error: tag $tag already exists on the remote. Aborting to prevent duplicate release." >&2
            exit 1
          fi
          tag_sha=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$tag" \
            -f message="Elastic RAMEN $tag" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            --jq .sha)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$tag_sha"

      - name: Create GitHub release
        id: create-release
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --draft \
            --title "v${{ inputs.version }}" \
            --notes "Elastic RAMEN v${{ inputs.version }}"
