name: Release Elastic RAMEN

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      # Token Policy:  https://github.com/elastic/catalog-info/tree/main/resources/github-token-policies/token-policy-elastic-ramen-release-ramen.yaml
      - uses: elastic/oblt-actions/github/create-token@v1
        id: fetch-token
        with:
          token-policy: token-policy-909fc0514fde

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: |
          tag="v${{ inputs.version }}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag$"; then
            echo "Error: tag $tag already exists on the remote. Aborting to prevent duplicate release." >&2
            exit 1
          fi
          git config user.name "elasticmachine"
          git config user.email "elasticmachine@users.noreply.github.com"
          git tag -a "$tag" -m "Elastic RAMEN $tag"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"

      - name: Create GitHub release
        id: create-release
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --draft \
            --title "v${{ inputs.version }}" \
            --notes "Elastic RAMEN v${{ inputs.version }}"
