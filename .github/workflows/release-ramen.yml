name: Release Elastic RAMEN

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      # Token Policy:  https://github.com/elastic/catalog-info/tree/main/resources/github-token-policies/token-policy-elastic-ramen-release-ramen.yaml
      - uses: elastic/oblt-actions/github/create-token@v1
        id: fetch-token
        with:
          token-policy: token-policy-909fc0514fde

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Checkout elastic CLI
        uses: actions/checkout@v4
        with:
          repository: elastic/cli
          ref: b056a344e6b9b27e09bb2b6270be2e6b8c5bf2fc
          path: cli
          token: ${{ steps.fetch-token.outputs.token }}

      - name: Create GitHub release
        id: create-release
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --draft \
            --title "v${{ inputs.version }}" \
            --notes "Elastic RAMEN v${{ inputs.version }}"
          RELEASE=$(gh release view "v${{ inputs.version }}" --json databaseId -q '.databaseId')
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE: ${{ steps.create-release.outputs.release }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
          ELASTIC_CLI_DIR: cli
        working-directory: packages/opencode
        run: bun run build

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        working-directory: packages/opencode
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            [ -f "$f" ] && gh release upload "v${{ inputs.version }}" "$f" --clobber
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: gh release edit "v${{ inputs.version }}" --draft=false
