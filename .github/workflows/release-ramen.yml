name: Release Elastic RAMEN

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string
      elastic-cli-ref:
        description: "Git ref for elastic CLI repo (branch/tag/sha). Leave empty to skip embedding the elastic CLI."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Setup Go
        if: inputs.elastic-cli-ref
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Checkout elastic CLI
        if: inputs.elastic-cli-ref
        uses: actions/checkout@v4
        with:
          repository: elastic/elastic-cli
          ref: ${{ inputs.elastic-cli-ref }}
          path: cli
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --draft \
            --title "v${{ inputs.version }}" \
            --notes "Elastic RAMEN v${{ inputs.version }}"
          RELEASE=$(gh release view "v${{ inputs.version }}" --json databaseId -q '.databaseId')
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE: ${{ steps.create-release.outputs.release }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELASTIC_CLI_DIR: ${{ inputs.elastic-cli-ref && 'cli' || '' }}
        working-directory: packages/opencode
        run: bun run build

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/opencode
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            [ -f "$f" ] && gh release upload "v${{ inputs.version }}" "$f" --clobber
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ inputs.version }}" --draft=false
