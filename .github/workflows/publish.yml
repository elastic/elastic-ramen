name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

# Don't let two release-published events double-publish the same tag.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to latest
        run: npm install -g npm@latest

      # Stage the SAME signed binaries that are on the GH release into
      # dist/ instead of rebuilding from source. The Buildkite
      # elastic-ramen-release pipeline produced and signed those binaries
      # (and uploaded sha512 + .asc sidecars). stage-from-release.ts
      # hard-fails if any platform archive is missing, any sha512 check
      # fails, or any linux .asc fails gpg verify.
      - name: Stage signed binaries from release
        env:
          OPENCODE_VERSION: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/opencode
        run: bun run script/stage-from-release.ts

      - name: Publish to npm
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ github.event.release.tag_name }}
          OPENCODE_RELEASE: "1"
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run script/publish.ts
