name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      # Token Policy:  https://github.com/elastic/catalog-info/tree/main/resources/github-token-policies/token-policy-elastic-ramen-release-ramen.yaml
      - uses: elastic/oblt-actions/github/create-token@v1
        id: fetch-token

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Checkout elastic CLI
        uses: actions/checkout@v4
        with:
          repository: elastic/cli
          ref: b056a344e6b9b27e09bb2b6270be2e6b8c5bf2fc
          path: cli
          token: ${{ steps.fetch-token.outputs.token }}

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Build CLI binaries
        env:
          OPENCODE_VERSION: ${{ github.event.release.tag_name }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
          ELASTIC_CLI_DIR: cli
        working-directory: packages/opencode
        run: bun run build

      - name: Publish to npm
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ github.event.release.tag_name }}
          OPENCODE_RELEASE: "1"
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run script/publish.ts
