name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - uses: elastic/oblt-actions/git/setup@v1

      - name: Patch elastic/cli for RAMEN integration
        run: git apply ../cli-patches/0001-ramen-integration.patch
        working-directory: packages/cli

      - name: Install CLI dependencies
        run: bun install
        working-directory: packages/cli

      - name: Build CLI workspace packages
        run: node_modules/.bin/tsc -b packages/es-schemas packages/config-resolver
        working-directory: packages/cli

      - name: Run unit tests
        run: bun turbo test
