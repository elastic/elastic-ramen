---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-elastic-ramen-release
  description: Buildkite pipeline that builds, signs, and creates a draft GitHub release for Elastic RAMEN.
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/elastic-ramen-release
spec:
  type: buildkite-pipeline
  owner: group:obs-elastic-brain-team
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: elastic-ramen-release
      description: Builds, signs, and creates a draft GitHub release for elastic-ramen.
    spec:
      repository: elastic/elastic-ramen
      pipeline_file: ".buildkite/release.yml"
      # Tag-triggered for production releases. Branch trigger is also
      # enabled but filtered to ci/* so the pipeline can be exercised as
      # a dry-run from feature branches (per design doc Phase 1, see
      # PR #58 r3147641992); other branches and PRs are skipped.
      provider_settings:
        build_branches: true
        build_pull_requests: false
        build_tags: true
        filter_enabled: true
        # Note: BK conditional expressions interpret `$` as env-var
        # substitution; escape end-of-string anchors as `$$`.
        filter_condition: |
          (build.branch =~ /^ci\//) || (build.tag =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$$/)
      cancel_intermediate_builds: false
      skip_intermediate_builds: false
      teams:
        obs-elastic-brain-team:
          access_level: MANAGE_BUILD_AND_READ
        observablt-robots:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
