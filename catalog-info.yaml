---
# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-elastic-ramen-release
  description: Buildkite pipeline that signs Elastic RAMEN release artifacts via unified-release-{gpg,macos,windows}-signing.
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/elastic-ramen-release
spec:
  type: buildkite-pipeline
  owner: group:obs-elastic-brain-team
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: elastic-ramen-release
      description: Signs elastic-ramen release artifacts.
    spec:
      repository: elastic/elastic-ramen
      pipeline_file: ".buildkite/release.yml"
      # Triggered natively by tag pushes (v*) from the
      # .github/workflows/release-ramen.yml release workflow, or manually
      # via ci/* branches for pipeline iteration. PR builds stay disabled.
      provider_settings:
        # Auto-run pipeline for ci/* branches and v* tag pushes.
        build_branches: true
        filter_condition: |
          build.branch =~ /^ci\// || build.tag =~ /^v/
        filter_enabled: true
        build_pull_requests: false
        build_tags: true
      cancel_intermediate_builds: false
      skip_intermediate_builds: false
      teams:
        obs-elastic-brain-team:
          access_level: MANAGE_BUILD_AND_READ
        observablt-robots:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
