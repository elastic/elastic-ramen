steps:
  - label: ":package: build binaries"
    key: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
      cpu: 2000m
      memory: 2048Mi
    if: build.branch =~ /^ci\//
    env:
      DRY_RUN: "true"
      BUN_VERSION: "1.3.14"
    command: ./.buildkite/scripts/release-build.sh
