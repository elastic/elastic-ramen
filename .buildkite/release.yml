steps:
  - label: ":package: build binaries"
    key: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
      cpu: 2000m
      memory: 2048Mi
    if: build.branch =~ /^ci\//
    env:
      DRY_RUN: "true"
      BUN_VERSION: "1.3.10"
    command: |
      set -euo pipefail

      : "$${BUN_VERSION:?BUN_VERSION must be set}"

      echo "Installing pinned Bun for build pipeline"
      echo "DRY_RUN=$${DRY_RUN:-unset}"
      echo "BUN_VERSION=$${BUN_VERSION}"

      export BUN_INSTALL="$${PWD}/.bun"
      export PATH="$${BUN_INSTALL}/bin:$${PATH}"

      if ! command -v bun >/dev/null 2>&1 || [[ "$$(bun --version)" != "$${BUN_VERSION}" ]]; then
        echo "Installing pinned Bun $${BUN_VERSION} from GitHub Releases..."
        if [[ "$$(uname -s)" != "Linux" ]]; then
          echo "This pipeline expects a Linux (Ubuntu) agent, got: $$(uname -s)"
          exit 1
        fi

        case "$$(uname -m)" in
          x86_64) target="bun-linux-x64" ;;
          aarch64|arm64) target="bun-linux-aarch64" ;;
          *)
            echo "Unsupported Linux architecture: $$(uname -m)"
            exit 1
            ;;
        esac

        if ! command -v unzip >/dev/null 2>&1; then
          echo "unzip is required to install Bun from GitHub release assets"
          exit 1
        fi

        tmp="$$(mktemp -d)"
        trap 'rm -rf "$${tmp}"' EXIT
        curl -fsSL \
          --retry 5 \
          --retry-all-errors \
          --retry-delay 2 \
          --connect-timeout 10 \
          --max-time 300 \
          "https://github.com/oven-sh/bun/releases/download/bun-v$${BUN_VERSION}/$${target}.zip" \
          -o "$${tmp}/bun.zip"
        unzip -q "$${tmp}/bun.zip" -d "$${tmp}"
        mkdir -p "$${BUN_INSTALL}/bin"
        install -m 0755 "$${tmp}/$${target}/bun" "$${BUN_INSTALL}/bin/bun"
      fi

      echo "Using Bun $$(bun --version)"
      cd packages/opencode
      bun install --frozen-lockfile
      bun run build
