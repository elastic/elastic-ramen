steps:
  - label: ":package: build binaries (ci dry-run)"
    if: build.branch =~ /^ci\//
    env:
      DRY_RUN: "true"
    artifact_paths:
      - "packages/opencode/dist/**/*"
    command: |
      set -euo pipefail

      echo "Building RAMEN binaries from packages/opencode"
      echo "DRY_RUN=${DRY_RUN}"

      cd packages/opencode
      bun install
      bun run build
