#
# Buildkite release pipeline for elastic-ramen.
#
# Mirror of elastic/synthetics-recorder/.buildkite/release.yml for the
# parts that handle signing, artifact download/upload, and the
# pre-command secret. Build job structure differs deliberately: bun
# cross-compiles all 12 platform binaries from a single Linux docker
# agent in one step (vs. their per-platform Electron native build), so
# we don't need a matrix.
#
# Step keys (sign-{gpg,macos,windows} and gpg/macos/windows for the
# dynamic download steps) are load-bearing — see
# .buildkite/scripts/download-signed-artifacts.sh and create-github-release.sh.
#
# Triggered by tag push (v[0-9]+.[0-9]+.[0-9]+ etc — see
# catalog-info.yaml filter_condition). The end of the pipeline creates a
# DRAFT GitHub release; a maintainer reviews it and clicks Publish in
# the UI, which fires .github/workflows/publish.yml to push the 13 npm
# packages.

steps:
  - label: ":package: Build and package all platforms"
    command: ".buildkite/scripts/build-and-package.sh"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential
    plugins:
      # Sources an ephemeral GH App token via Vault and exports
      # GITHUB_TOKEN — needed for the elastic/cli checkout in
      # build-and-package.sh.
      - elastic/vault-github-token#v0.1.0

  - wait: ~

  # signtool needs a bare PE — extract elastic-ramen.exe from each
  # ramen-windows-*.zip and re-upload as artifacts-to-sign/<base>.exe so
  # the windows trigger step's DOWNLOAD_ARTIFACTS_FILTER='*.exe' picks it up.
  - label: ":windows: Prep windows .exe for Authenticode"
    command: ".buildkite/scripts/prepare-windows-exes.sh"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential

  # GPG signs the bare elastic-ramen binary (matching what we do for
  # darwin/windows) rather than the wrapper .tar.gz; create-github-release.sh
  # bundles the resulting .asc back into the tarball alongside the binary.
  - label: ":linux: Prep linux binaries for GPG signing"
    command: ".buildkite/scripts/prepare-linux-bins.sh"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential

  - wait: ~

  - label: GPG Sign artifacts
    trigger: unified-release-gpg-signing
    # NOTE: If you change 'key: sign-gpg' then change the matching call to
    # .buildkite/scripts/download-signed-artifacts.sh below.
    key: sign-gpg
    build:
      env:
        DOWNLOAD_ARTIFACTS_FILTER: "ramen-linux-*-elastic-ramen"
        INPUT_PATH: buildkite://

  - label: MacOS Sign artifacts
    trigger: unified-release-macos-signing
    key: sign-macos
    build:
      env:
        INPUT_PATH: buildkite://

  - label: Windows Sign artifacts
    trigger: unified-release-windows-signing
    key: sign-windows
    build:
      env:
        DOWNLOAD_ARTIFACTS_FILTER: "*.exe"
        INPUT_PATH: buildkite://

  - wait: ~

  # The order matters: gpg files first, windows next, macos last. The
  # current BK pipeline helpers use opinionated folder names
  # (artifacts-to-sign and signed-artifacts) so the macos step must
  # run last to avoid clobbering the others' outputs in signed-artifacts/.
  - label: Download signed artifacts (windows and gpg)
    commands:
      - .buildkite/scripts/download-signed-artifacts.sh "sign-gpg" "gpg"
      - .buildkite/scripts/download-signed-artifacts.sh "sign-windows" "windows"
      - .buildkite/scripts/download-signed-artifacts.sh "sign-gpg" "gpg" | buildkite-agent pipeline upload
      - .buildkite/scripts/download-signed-artifacts.sh "sign-windows" "windows" | buildkite-agent pipeline upload
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential

  - wait: ~

  - label: Download signed artifacts (macos)
    commands:
      - .buildkite/scripts/download-signed-artifacts.sh "sign-macos" "macos"
      - .buildkite/scripts/download-signed-artifacts.sh "sign-macos" "macos" | buildkite-agent pipeline upload
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential

  - wait: ~

  - label: ":github: Publish GitHub release (draft)"
    commands:
      - .buildkite/scripts/create-github-release.sh
    # Step names ("gpg", "windows", "macos") are emitted by
    # .buildkite/scripts/download-signed-artifacts.sh as the dynamic step keys.
    depends_on:
      - "gpg"
      - "windows"
      - "macos"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential
    plugins:
      # Sources an ephemeral GH App token via Vault and exports
      # GITHUB_TOKEN — replaces the ad-hoc export in the pre-command hook.
      - elastic/vault-github-token#v0.1.0

notify:
  - slack: "#elastic-ramen-releases"
    if: 'build.state != "passed"'
