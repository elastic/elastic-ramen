steps:
  - label: ":package: build binaries"
    key: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
      cpu: 2000m
      memory: 2048Mi
    if: build.branch =~ /^ci\//
    env:
      DRY_RUN: "true"
      BUN_VERSION: "1.3.14"
    artifact_paths:
      - "packages/opencode/dist/ramen-*/bin/*"
    retry:
      automatic:
        - exit_status: "*"
          limit: 2
    command: ./.buildkite/scripts/release-build.sh

  - label: ":apple: pack mac archives"
    key: "pack-mac"
    depends_on: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    artifact_paths:
      - "artifacts-to-sign/ramen-darwin-*.tar.gz"
    command: ./.buildkite/scripts/pack-mac.sh

  - label: ":windows: pack windows archives"
    key: "pack-windows"
    depends_on: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    artifact_paths:
      - "artifacts-to-sign/ramen-windows-*.exe"
    command: ./.buildkite/scripts/pack-windows.sh

  - label: ":penguin: pack linux archives"
    key: "pack-linux"
    depends_on: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    artifact_paths:
      - "artifacts-to-sign/ramen-linux-*.tgz"
    command: ./.buildkite/scripts/pack-linux.sh

  - label: ":apple: macOS sign"
    trigger: unified-release-macos-signing
    key: macos-sign-service
    depends_on: "pack-mac"
    build:
      env:
        INPUT_PATH: "buildkite://"

  - label: ":windows: Windows sign"
    trigger: unified-release-windows-signing
    key: windows-sign-service
    depends_on: "pack-windows"
    build:
      env:
        INPUT_PATH: "buildkite://"
        DOWNLOAD_ARTIFACTS_FILTER: "ramen-windows-*.exe"

  - label: ":lock: GPG sign linux archives"
    trigger: unified-release-gpg-signing
    key: gpg-sign-service
    depends_on: "pack-linux"
    build:
      env:
        INPUT_PATH: "buildkite://"

  - label: ":inbox_tray: collect signed artifacts"
    key: "collect"
    depends_on:
      - "macos-sign-service"
      - "windows-sign-service"
      - "gpg-sign-service"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    plugins:
      - elastic/vault-secrets#v0.1.0:
          path: "kv/ci-shared/observability-ci/buildkite-read-build-access"
          field: "buildkite_token"
          env_var: "BUILDKITE_TOKEN_SECRET"
    artifact_paths:
      - "final/*"
    command: ./.buildkite/scripts/collect-signed.sh
