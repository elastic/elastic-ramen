steps:
  - label: ":package: build binaries"
    key: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
      cpu: 2000m
      memory: 2048Mi
    if: build.branch =~ /^ci\//
    env:
      DRY_RUN: "true"
      BUN_VERSION: "1.3.14"
    artifact_paths:
      - "packages/opencode/dist/ramen-*/bin/*"
    command: ./.buildkite/scripts/release-build.sh

  - label: ":scissors: extract mac/win binaries"
    key: "extract"
    depends_on: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    artifact_paths:
      - "artifacts-to-sign/extracted/**/elastic-ramen"
      - "artifacts-to-sign/extracted/**/elastic-ramen.exe"
    command: ./.buildkite/scripts/extract-binaries.sh

  - label: ":penguin: pack linux archives"
    key: "pack-linux"
    depends_on: "build"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    artifact_paths:
      - "artifacts-to-sign/ramen-linux-*.tar.gz"
    command: ./.buildkite/scripts/pack-linux.sh

  - label: ":pgp: GPG sign linux archives"
    trigger: unified-release-gpg-signing
    key: gpg-sign-service
    depends_on: "pack-linux"
    build:
      env:
        INPUT_PATH: "buildkite://"

  - label: ":apple: macOS sign"
    trigger: unified-release-macos-signing
    key: macos-sign-service
    depends_on: "extract"
    build:
      env:
        INPUT_PATH: "buildkite://"

  - label: ":windows: Windows sign"
    trigger: unified-release-windows-signing
    key: windows-sign-service
    depends_on: "extract"
    build:
      env:
        INPUT_PATH: "buildkite://"
        DOWNLOAD_ARTIFACTS_FILTER: "extracted/windows-*/elastic-ramen.exe"

  - label: ":package: repack signed mac/win archives"
    key: "repack"
    depends_on:
      - "build"
      - "macos-sign-service"
      - "windows-sign-service"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    plugins:
      - elastic/vault-secrets#v0.1.0:
          path: "kv/ci-shared/observability-ci/buildkite-read-build-access"
          field: "buildkite_token"
          env_var: "BUILDKITE_TOKEN_SECRET"
    artifact_paths:
      - "signed/ramen-*.zip"
    command: ./.buildkite/scripts/repack-signed.sh

  - label: ":inbox_tray: collect signatures"
    key: "collect"
    depends_on:
      - "gpg-sign-service"
    agents:
      image: docker.elastic.co/ci-agent-images/ubuntu-build-essential:latest
    plugins:
      - elastic/vault-secrets#v0.1.0:
          path: "kv/ci-shared/observability-ci/buildkite-read-build-access"
          field: "buildkite_token"
          env_var: "BUILDKITE_TOKEN_SECRET"
    artifact_paths:
      - "signed/ramen-*.asc"
    command: ./.buildkite/scripts/collect-signatures.sh
