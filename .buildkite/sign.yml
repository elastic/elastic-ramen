# STUB pipeline for elastic-ramen-sign.
#
# The full signing pipeline ships in #43. This stub exists so the BK
# pipeline (registered via catalog-info.yaml in this PR) has something
# runnable on the default branch — required to be able to trigger builds
# against feature branches (e.g. ci/buildkite-signing-integration) while
# iterating on the real definition.
#
# Safe to leave merged: release-ramen.yml on `dev` does NOT trigger this
# pipeline (the BK trigger step also ships in #43). A stray build that
# somehow reaches this stub will print a message and exit clean — it
# won't sign or upload anything.
#
# DELETE WHEN #43 LANDS — that PR replaces this file with the real
# multi-step pipeline.

steps:
  - label: ":construction: elastic-ramen-sign stub (ci dry-run)"
    if: build.branch =~ /^ci\//
    env:
      DRY_RUN: "true"
    command: |
      echo "This is the stub pipeline."
      echo "DRY_RUN=${DRY_RUN}"
      echo "If you're seeing this on a real release, the BK trigger in"